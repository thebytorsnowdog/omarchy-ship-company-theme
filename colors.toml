# Ship Company — warm kitchen. Body text is paper, not gold.
# Gold is the accent (borders, titles). Terminal colours are lifted so code
# stays readable on #2b2218; raw sweet-potato #905030 is only 2.5:1 there,
# so orange/brown are the same hue pulled up to at least 5.5:1.
mode = "dark"

accent = "#edca2f"
selection = "#4a3824"
selection_background = "#4a3824"
selection_foreground = "#faf6ec"
muted = "#b7a48c"

background = "#2b2218"
dark_background = "#221b13"
darker_background = "#1a1510"
lighter_background = "#3d3124"

foreground = "#faf6ec"
dark_foreground = "#c4b29a"
light_foreground = "#f3eadc"
bright_foreground = "#fff8ee"

# ANSI. Yellow is a quieter gold than the accent so strings do not shout.
red = "#e07a62"
yellow = "#d4b15a"
orange = "#d4894a"
green = "#1db86c"
cyan = "#7ec8b3"
blue = "#8eb4d4"
magenta = "#e0a8b4"
brown = "#c4926a"

bright_red = "#f09a84"
bright_yellow = "#e6c56a"
bright_green = "#4dce8c"
bright_blue = "#b4d0e6"
bright_magenta = "#f0c4cc"
bright_cyan = "#a8e0d0"

hyprland_active_border = "#edca2f #d4894a 45deg"
hyprland_inactive_border = "#5c4a38"
